spring.datasource.url=jdbc:h2:file:./data/tradevault;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
server.error.include-message=always
# NIO2 avoids a Windows/JDK selector failure that can prevent the default NIO
# connector from binding localhost. The default bind supports localhost and LAN use.
server.port=8080
spring.mail.host=${TRADEVAULT_SMTP_HOST:}
spring.mail.port=${TRADEVAULT_SMTP_PORT:587}
spring.mail.username=${TRADEVAULT_SMTP_USERNAME:}
spring.mail.password=${TRADEVAULT_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
tradevault.mail.from=${TRADEVAULT_MAIL_FROM:${TRADEVAULT_SMTP_USERNAME:}}
tradevault.jwt.secret=${TRADEVAULT_JWT_SECRET:tradevault-development-key-change-this-to-a-secure-32-byte-minimum-secret}
tradevault.jwt.expiry-hours=12
