spring.application.name=TradeVault
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
spring.mail.host=${TRADEVAULT_SMTP_HOST:}
spring.mail.port=${TRADEVAULT_SMTP_PORT:587}
spring.mail.username=${TRADEVAULT_SMTP_USERNAME:}
spring.mail.password=${TRADEVAULT_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
tradevault.mail.from=${TRADEVAULT_MAIL_FROM:${TRADEVAULT_SMTP_USERNAME:}}
tradevault.jwt.expiry-hours=${TRADEVAULT_JWT_EXPIRY_HOURS:12}
